[project]
name = "codex-qa-logger"
version = "0.1.0"
description = "Local Codex session to QA diary logger"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "BUSL-1.1" }

[project.scripts]
qa-logger = "qa_logger.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
